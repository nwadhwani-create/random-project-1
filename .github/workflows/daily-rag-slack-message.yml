name: Daily RAG Slack Message

on:
  schedule:
    # 3pm America/Los_Angeles is 22:00 UTC during daylight time and
    # 23:00 UTC during standard time. The script checks the local hour.
    - cron: "0 22,23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-rag:
    runs-on: ubuntu-latest
    env:
      MESSAGE_TEXT: RAG
      SLACK_CHANNEL: players-only-comm-west
      TARGET_HOUR: "15"
      TARGET_TIME_ZONE: America/Los_Angeles
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send RAG message
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: node .github/scripts/send-daily-rag.mjs
