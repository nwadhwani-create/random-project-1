name: Daily RAG Slack message

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: Send immediately instead of waiting for 3pm Pacific
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  post-rag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Post RAG to Slack
        env:
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_send == 'true' }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_CHANNEL_NAME: players-only-comm-west
        run: node .github/scripts/post-rag-slack.mjs
