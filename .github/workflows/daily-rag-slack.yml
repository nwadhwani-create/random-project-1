name: Daily RAG Slack Message

on:
  # GitHub cron uses UTC. These schedules cover 3pm America/Los_Angeles
  # across daylight saving changes; the script skips runs outside 3pm local time.
  schedule:
    - cron: "0 22 * 3-11 *"
    - cron: "0 23 * 1-3,11-12 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-rag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Send RAG to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.RAG_SLACK_CHANNEL_ID }}
          SLACK_CHANNEL: "#players-only-comm-west"
          SLACK_MESSAGE: "RAG"
          RAG_TIMEZONE: "America/Los_Angeles"
          RAG_TARGET_HOUR: "15"
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python3 .github/scripts/send_rag_slack.py --respect-schedule
          else
            python3 .github/scripts/send_rag_slack.py
          fi
