name: Daily RAG Slack Message

on:
  schedule:
    # GitHub schedules are UTC. These two entries cover 3pm Pacific time
    # across daylight saving time changes.
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  send-rag:
    runs-on: ubuntu-latest

    steps:
      - name: Check 3pm Pacific send window
        id: send-window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_send=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(TZ=America/Los_Angeles date +%H)" = "15" ]; then
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.send-window.outputs.should_send == 'true'
        uses: actions/checkout@v4

      - name: Send RAG to Slack
        if: steps.send-window.outputs.should_send == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: "#players-only-comm-west"
        run: python3 scripts/send_daily_rag_slack.py
