name: Daily RAG Slack Message

on:
  schedule:
    # GitHub schedules are UTC. Running at both possible UTC offsets lets the
    # script send at 3pm America/Los_Angeles across daylight saving changes.
    - cron: "0 22,23 * * *"
  workflow_dispatch:

jobs:
  post-rag:
    runs-on: ubuntu-latest
    steps:
      - name: Post RAG to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_NAME: players-only-comm-west
          SLACK_MESSAGE: RAG
        run: |
          node <<'NODE'
          const token = process.env.SLACK_BOT_TOKEN;
          const channelName = process.env.SLACK_CHANNEL_NAME;
          const message = process.env.SLACK_MESSAGE;
          const eventName = process.env.GITHUB_EVENT_NAME;

          async function slack(method, body) {
            const response = await fetch(`https://slack.com/api/${method}`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json; charset=utf-8",
              },
              body: JSON.stringify(body),
            });

            if (!response.ok) {
              throw new Error(`${method} failed with HTTP ${response.status}: ${await response.text()}`);
            }

            const data = await response.json();
            if (!data.ok) {
              throw new Error(`${method} failed: ${data.error}`);
            }

            return data;
          }

          async function findChannelIdByName(name) {
            let cursor;

            do {
              const data = await slack("conversations.list", {
                cursor,
                exclude_archived: true,
                limit: 1000,
                types: "public_channel,private_channel",
              });

              const channel = data.channels.find((candidate) => candidate.name === name);
              if (channel) {
                return channel.id;
              }

              cursor = data.response_metadata?.next_cursor;
            } while (cursor);

            throw new Error(`Could not find Slack channel #${name}. Confirm the bot can access it.`);
          }

          async function main() {
            if (!token) {
              throw new Error("Missing SLACK_BOT_TOKEN secret.");
            }

            if (eventName === "schedule") {
              const losAngelesHour = new Intl.DateTimeFormat("en-US", {
                hour: "2-digit",
                hour12: false,
                timeZone: "America/Los_Angeles",
              }).format(new Date());

              if (losAngelesHour !== "15") {
                console.log(`Skipping run because it is ${losAngelesHour}:00 in America/Los_Angeles, not 15:00.`);
                return;
              }
            }

            const channel = await findChannelIdByName(channelName);
            const result = await slack("chat.postMessage", {
              channel,
              text: message,
            });

            console.log(`Posted "${message}" to #${channelName} at ${result.ts}.`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
